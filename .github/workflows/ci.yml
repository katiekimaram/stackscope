name: Validate StackScope
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web-and-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: stackscope-web
          path: dist/
      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
  windows-desktop:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:dist -- --win nsis --publish never
      - name: Install the Windows package
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/StackScope-*-win-x64.exe | Select-Object -First 1
          if (-not $installer) { throw 'StackScope installer is missing.' }
          $target = Join-Path $env:RUNNER_TEMP 'StackScope-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$target") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $executable = Join-Path $target 'StackScope.exe'
          if (-not (Test-Path $executable)) { throw 'Installed StackScope executable is missing.' }
          "STACKSCOPE_TEST_EXE=$executable" >> $env:GITHUB_ENV
      - name: Launch installed app and verify collection and tray
        shell: pwsh
        run: node tests/electron.smoke.mjs "$env:STACKSCOPE_TEST_EXE"
      - uses: actions/upload-artifact@v4
        with:
          name: stackscope-windows-preview
          path: release/*.exe
